name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci-static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check plugins
        run: |
          node --check plugins/auto-continue.mjs
          node --check plugins/anti-repetition.mjs
      - name: Portable static suite (no DSH required)
        run: node test/ci-static.mjs
